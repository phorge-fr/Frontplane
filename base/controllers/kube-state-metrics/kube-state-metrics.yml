apiVersion: v1
kind: Namespace
metadata:
    name: kube-state-metrics
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
    name: prometheus-community
    namespace: kube-state-metrics
spec:
    interval: 1h0s
    url: https://prometheus-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: kube-state-metrics
    namespace: kube-state-metrics
spec:
    chart:
        spec:
            chart: kube-state-metrics
            version: '8.5.0'
            sourceRef:
                kind: HelmRepository
                name: prometheus-community
    interval: 1h0s
    timeout: 5m0s
    values:
        updateStrategy:
            type: RollingUpdate
            rollingUpdate:
                maxUnavailable: 0
                maxSurge: 1
