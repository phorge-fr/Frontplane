---
apiVersion: v1
kind: Namespace
metadata:
  name: traefik
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 24h
  url: https://traefik.github.io/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik-local
  namespace: traefik
spec:
  interval: 30m
  chart:
    spec:
      chart: traefik
      version: "41.5.0"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: traefik
      interval: 12h
  values:
    fullnameOverride: traefik-local
    ingressClass:
      enabled: true
      isDefaultClass: false
      name: traefik-local
    providers:
      kubernetesIngress:
        ingressClass: traefik-local
    service:
      type: LoadBalancer
      annotations:
        lbipam.cilium.io/ips: "10.0.0.10"
    ports:
      web:
        http:
          redirections: {}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik-public
  namespace: traefik
spec:
  interval: 30m
  chart:
    spec:
      chart: traefik
      version: "41.5.0"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: traefik
      interval: 12h
  values:
    fullnameOverride: traefik-public
    ingressClass:
      enabled: true
      isDefaultClass: false
      name: traefik-public
    providers:
      kubernetesIngress:
        ingressClass: traefik-public
    service:
      type: LoadBalancer
      annotations:
        lbipam.cilium.io/ips: "10.0.0.11"
    ports:
      web:
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
      websecure:
        proxyProtocol:
          trustedIPs: []
