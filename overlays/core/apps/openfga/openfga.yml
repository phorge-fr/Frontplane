apiVersion: v1
kind: Namespace
metadata:
    name: openfga
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    name: openfga-postgres-pvc
    namespace: openfga
spec:
    storageClassName: longhorn
    accessModes:
        - ReadWriteOnce
    resources:
        requests:
            storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: openfga-postgres
    namespace: openfga
    labels:
        app: openfga-postgres
spec:
    replicas: 1
    strategy:
        type: Recreate
    selector:
        matchLabels:
            app: openfga-postgres
    template:
        metadata:
            labels:
                app: openfga-postgres
        spec:
            securityContext:
                fsGroup: 999
            containers:
                - name: postgres
                  image: docker.io/library/postgres:18.6-bookworm
                  env:
                    - name: POSTGRES_USER
                      value: openfga
                    - name: POSTGRES_DB
                      value: openfga
                    - name: POSTGRES_PASSWORD
                      valueFrom:
                        secretKeyRef:
                            name: openfga-postgres-secret
                            key: postgresPassword
                    - name: PGDATA
                      value: /var/lib/postgresql/data/pgdata
                  ports:
                    - containerPort: 5432
                  volumeMounts:
                    - name: data
                      mountPath: /var/lib/postgresql/data
                  securityContext:
                    runAsUser: 999
                    runAsGroup: 999
                    runAsNonRoot: true
                    allowPrivilegeEscalation: false
                    capabilities:
                        drop:
                            - ALL
                  readinessProbe:
                    exec:
                        command:
                            - pg_isready
                            - -U
                            - openfga
                    initialDelaySeconds: 5
                    periodSeconds: 10
                  livenessProbe:
                    exec:
                        command:
                            - pg_isready
                            - -U
                            - openfga
                    initialDelaySeconds: 15
                    periodSeconds: 20
            volumes:
                - name: data
                  persistentVolumeClaim:
                    claimName: openfga-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
    name: openfga-postgres
    namespace: openfga
spec:
    selector:
        app: openfga-postgres
    ports:
        - port: 5432
          targetPort: 5432
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
    name: openfga
    namespace: openfga
spec:
    interval: 1h0s
    url: https://openfga.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: openfga
    namespace: openfga
spec:
    chart:
        spec:
            chart: openfga
            version: 0.3.15
            sourceRef:
                kind: HelmRepository
                name: openfga
    interval: 1h0s
    timeout: 5m0s
    values:
        replicaCount: 1
        datastore:
            engine: postgres
            existingSecret: openfga-secrets
            secretKeys:
                uriKey: datastoreUri
            migrationType: initContainer
        authn:
            method: preshared
            preshared:
                keysSecret: openfga-secrets
        playground:
            enabled: false
        service:
            type: ClusterIP
        telemetry:
            metrics:
                enableRPCHistograms: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
    name: openfga-basic-auth-middleware
    namespace: openfga
spec:
    basicAuth:
        secret: openfga-basic-auth-secret
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: openfga
    namespace: openfga
    annotations:
        traefik.ingress.kubernetes.io/router.middlewares: openfga-openfga-basic-auth-middleware@kubernetescrd
        cert-manager.io/cluster-issuer: local-issuer
        cert-manager.io/common-name: openfga.core.phorge
spec:
    ingressClassName: traefik-local
    tls:
        - hosts:
            - openfga.core.phorge
          secretName: openfga-tls
    rules:
        - host: openfga.core.phorge
          http:
            paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                        name: openfga
                        port:
                            number: 8080
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
    name: openfga
    namespace: openfga
    labels:
        release: kube-prometheus-stack
spec:
    selector:
        matchLabels:
            app.kubernetes.io/name: openfga
    endpoints:
        - port: metrics
          path: /metrics
          interval: 30s
---
apiVersion: v1
kind: ConfigMap
metadata:
    name: openfga-dashboard
    namespace: kube-prometheus-stack
    labels:
        grafana_dashboard: "1"
data:
    openfga.json: |
        {
          "title": "OpenFGA Dashboard",
          "uid": "openfga-overview",
          "description": "Official dashboard from github.com/openfga/openfga/telemetry/grafana/dashboards/openfga.json. Enabled telemetry.metrics.enableRPCHistograms (was off by default, no cost otherwise) to get real p50/p90/p99 request latency instead of dropping those panels. Fixed the cache hit ratio panel's metric names to match this OpenFGA version (openfga_check_cache_hit_count / openfga_check_cache_total_count, no _total suffix). Dropped the SQL metrics panel: go_sql_* isn't exposed by this OpenFGA build at all.",
          "tags": ["openfga"],
          "timezone": "browser",
          "schemaVersion": 39,
          "version": 1,
          "panels": [
            { "id": 100, "title": "Server Metrics", "type": "row", "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 } },
            {
              "id": 1,
              "title": "p50 Request Duration by Method",
              "type": "timeseries",
              "gridPos": { "h": 8, "w": 8, "x": 0, "y": 1 },
              "fieldConfig": { "defaults": { "unit": "s" } },
              "targets": [
                {
                  "expr": "histogram_quantile(0.5, sum by(le, grpc_method, grpc_service) (rate(grpc_server_handling_seconds_bucket{job=\"openfga\", grpc_type=\"unary\", grpc_service=\"openfga.v1.OpenFGAService\"}[2m])))",
                  "legendFormat": "{{grpc_method}}"
                }
              ]
            },
            {
              "id": 2,
              "title": "p90 Request Duration by Method",
              "type": "timeseries",
              "gridPos": { "h": 8, "w": 8, "x": 8, "y": 1 },
              "fieldConfig": { "defaults": { "unit": "s" } },
              "targets": [
                {
                  "expr": "histogram_quantile(0.9, sum by(le, grpc_method, grpc_service) (rate(grpc_server_handling_seconds_bucket{job=\"openfga\", grpc_type=\"unary\", grpc_service=\"openfga.v1.OpenFGAService\"}[2m])))",
                  "legendFormat": "{{grpc_method}}"
                }
              ]
            },
            {
              "id": 3,
              "title": "p99 Request Duration by Method",
              "type": "timeseries",
              "gridPos": { "h": 8, "w": 8, "x": 16, "y": 1 },
              "fieldConfig": { "defaults": { "unit": "s" } },
              "targets": [
                {
                  "expr": "histogram_quantile(0.99, sum by(le, grpc_method, grpc_service) (rate(grpc_server_handling_seconds_bucket{job=\"openfga\", grpc_type=\"unary\", grpc_service=\"openfga.v1.OpenFGAService\"}[2m])))",
                  "legendFormat": "{{grpc_method}}"
                }
              ]
            },
            {
              "id": 4,
              "title": "RPS per Method",
              "type": "timeseries",
              "gridPos": { "h": 8, "w": 8, "x": 0, "y": 9 },
              "targets": [
                {
                  "expr": "sum(rate(grpc_server_started_total{job=\"openfga\",grpc_service=\"openfga.v1.OpenFGAService\"}[1m])) by (grpc_method)",
                  "legendFormat": "{{grpc_method}}"
                }
              ]
            },
            {
              "id": 5,
              "title": "Status Code Count per Method",
              "type": "timeseries",
              "gridPos": { "h": 8, "w": 8, "x": 8, "y": 9 },
              "targets": [
                {
                  "expr": "sum by(grpc_code, grpc_method) (rate(grpc_server_handled_total{grpc_service=\"openfga.v1.OpenFGAService\"}[1m]))",
                  "legendFormat": "{{grpc_method}} - {{grpc_code}}"
                }
              ]
            },
            {
              "id": 6,
              "title": "Check Cache Hit Ratio",
              "type": "timeseries",
              "gridPos": { "h": 8, "w": 8, "x": 16, "y": 9 },
              "fieldConfig": { "defaults": { "unit": "percent", "max": 100, "min": 0 } },
              "targets": [
                {
                  "expr": "(sum(increase(openfga_check_cache_hit_count[1m])) / sum(increase(openfga_check_cache_total_count[1m]))) * 100"
                }
              ]
            },
            { "id": 101, "title": "Go Runtime Metrics", "type": "row", "gridPos": { "h": 1, "w": 24, "x": 0, "y": 25 } },
            {
              "id": 8,
              "title": "Goroutines",
              "type": "timeseries",
              "gridPos": { "h": 8, "w": 12, "x": 0, "y": 26 },
              "targets": [
                { "expr": "go_goroutines{job=\"openfga\"}", "legendFormat": "count" },
                { "expr": "irate(go_goroutines{job=\"openfga\"}[2m])", "legendFormat": "rate of change" }
              ]
            },
            {
              "id": 9,
              "title": "Go GC Duration",
              "type": "timeseries",
              "gridPos": { "h": 8, "w": 12, "x": 12, "y": 26 },
              "fieldConfig": { "defaults": { "unit": "s" } },
              "targets": [
                { "expr": "go_gc_duration_seconds{job=\"openfga\", quantile=\"0.5\"}", "legendFormat": "p50" },
                { "expr": "go_gc_duration_seconds{job=\"openfga\", quantile=\"0.75\"}", "legendFormat": "p75" },
                { "expr": "go_gc_duration_seconds{job=\"openfga\", quantile=\"1\"}", "legendFormat": "max" }
              ]
            },
            {
              "id": 10,
              "title": "Heap Memory Usage",
              "type": "timeseries",
              "gridPos": { "h": 8, "w": 8, "x": 0, "y": 34 },
              "fieldConfig": { "defaults": { "unit": "bytes" } },
              "targets": [{ "expr": "go_memstats_heap_alloc_bytes{job=\"openfga\"}" }]
            },
            {
              "id": 11,
              "title": "Memory Allocation Rate (malloc/sec)",
              "type": "timeseries",
              "gridPos": { "h": 8, "w": 8, "x": 8, "y": 34 },
              "targets": [{ "expr": "rate(go_memstats_mallocs_total{job=\"openfga\"}[2m])" }]
            },
            {
              "id": 12,
              "title": "Heap Allocation Rate (bytes/sec)",
              "type": "timeseries",
              "gridPos": { "h": 8, "w": 8, "x": 16, "y": 34 },
              "fieldConfig": { "defaults": { "unit": "Bps" } },
              "targets": [{ "expr": "rate(go_memstats_alloc_bytes_total{job=\"openfga\"}[2m])" }]
            }
          ]
        }
