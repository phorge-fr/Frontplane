apiVersion: apps/v1
kind: Deployment
metadata:
    name: openfga-postgres
    namespace: openfga
    labels:
        app: openfga-postgres
spec:
    replicas: 1
    strategy:
        type: Recreate
    selector:
        matchLabels:
            app: openfga-postgres
    template:
        metadata:
            labels:
                app: openfga-postgres
        spec:
            securityContext:
                fsGroup: 999
            containers:
                - name: postgres
                  image: docker.io/library/postgres:18.6-bookworm
                  env:
                    - name: POSTGRES_USER
                      value: openfga
                    - name: POSTGRES_DB
                      value: openfga
                    - name: POSTGRES_PASSWORD
                      valueFrom:
                        secretKeyRef:
                            name: openfga-postgres-secret
                            key: ENC[AES256_GCM,data:GOKieJ2mUwm9uqLv11lDug==,iv:Z0/Q+Z/9YU66Rxf4QmXp+Ebap9MqFH6JWAtpXhNciQw=,tag:PTOszR3gcX6vChLvkywWEA==,type:str]
                    - name: PGDATA
                      value: /var/lib/postgresql/data/pgdata
                  ports:
                    - containerPort: 5432
                  volumeMounts:
                    - name: data
                      mountPath: /var/lib/postgresql/data
                  securityContext:
                    runAsUser: 999
                    runAsGroup: 999
                    runAsNonRoot: true
                    allowPrivilegeEscalation: false
                    capabilities:
                        drop:
                            - ALL
                  readinessProbe:
                    exec:
                        command:
                            - pg_isready
                            - -U
                            - openfga
                    initialDelaySeconds: 5
                    periodSeconds: 10
                  livenessProbe:
                    exec:
                        command:
                            - pg_isready
                            - -U
                            - openfga
                    initialDelaySeconds: 15
                    periodSeconds: 20
            volumes:
                - name: data
                  persistentVolumeClaim:
                    claimName: openfga-postgres-pvc
