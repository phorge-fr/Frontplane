apiVersion: v1
kind: Namespace
metadata:
    name: authentik
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
    name: authentik
    namespace: authentik
spec:
    interval: 1m0s
    timeout: 1m0s
    url: https://charts.goauthentik.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: authentik
    namespace: authentik
spec:
    chart:
        spec:
            chart: authentik
            sourceRef:
                kind: HelmRepository
                name: authentik
            version: 2026.8.2
    interval: 1m0s
    timeout: 10m0s
    valuesFrom:
        - kind: Secret
          name: authentik-secrets
          valuesKey: secretKey
          targetPath: authentik.secret_key
        - kind: Secret
          name: authentik-secrets
          valuesKey: postgresPassword
          targetPath: authentik.postgresql.password
        - kind: Secret
          name: authentik-secrets
          valuesKey: postgresPassword
          targetPath: postgresql.auth.password
    values:
        global:
            security:
                allowInsecureImages: true
            image:
                repository: ghcr.io/goauthentik/server
                tag: 2026.8.2
            addPrometheusAnnotations: false
            env: []
            envFrom: []
            volumeMounts: []
            volumes: []
        blueprints:
            configMaps:
                - authentik-grafana-oauth-blueprint
                - authentik-forgejo-oauth-blueprint
                - authentik-brand
        authentik:
            enabled: true
            log_level: info
            existingSecret:
                secretName: ""
            events:
                context_processors:
                    geoip: /geoip/GeoLite2-City.mmdb
                    asn: /geoip/GeoLite2-ASN.mmdb
            web:
                path: /
            email:
                host: ""
                port: 587
                username: ""
                password: ""
                use_tls: false
                use_ssl: false
                timeout: 30
                from: ""
            outposts:
                container_image_base: ghcr.io/goauthentik/%(type)s:%(version)s
            error_reporting:
                enabled: false
                environment: k8s
                send_pii: false
            postgresql:
                host: '{{ .Release.Name }}-postgresql'
                name: authentik
                user: authentik
                port: 5432
        server:
            enabled: true
            name: server
            replicas: 1
            env: []
            envFrom: []
            extraContainers: []
            initContainers: []
            volumeMounts: []
            volumes: []
            containerPorts:
                http: 9000
                https: 9443
                metrics: 9300
            hostNetwork: false
            service:
                annotations: {}
                labels: {}
                type: ClusterIP
                nodePortHttp: 30080
                nodePortHttps: 30443
                servicePortHttp: 80
                servicePortHttps: 443
                servicePortHttpName: http
                servicePortHttpsName: https
                loadBalancerIP: ""
                loadBalancerSourceRanges: []
                externalIPs: []
                externalTrafficPolicy: ""
                sessionAffinity: ""
                sessionAffinityConfig: {}
            metrics:
                enabled: true
                service:
                    type: ClusterIP
                    clusterIP: ""
                    annotations: {}
                    labels: {}
                    servicePort: 9300
                    portName: metrics
                serviceMonitor:
                    enabled: true
                    interval: 30s
                    scrapeTimeout: 3s
                    relabelings: []
                    metricRelabelings: []
                    selector: {}
                    scheme: ""
                    tlsConfig: {}
                    namespace: ""
                    labels:
                        release: kube-prometheus-stack
                    annotations: {}
            ingress:
                enabled: true
                annotations:
                    cert-manager.io/cluster-issuer: public-issuer
                labels: {}
                ingressClassName: traefik-public
                hosts:
                    - auth.phorge.fr
                paths:
                    - '{{ .Values.authentik.web.path }}'
                pathType: Prefix
                tls:
                    - hosts:
                        - auth.phorge.fr
                      secretName: authentik-tls
                https: false
        worker:
            enabled: true
            name: worker
            replicas: 1
            env: []
            envFrom: []
            extraContainers: []
            initContainers: []
            volumeMounts: []
            volumes: []
            containerPorts:
                http: 9000
                metrics: 9300
            metrics:
                enabled: true
                service:
                    type: ClusterIP
                    clusterIP: ""
                    annotations: {}
                    labels: {}
                    servicePort: 9300
                    portName: metrics
                serviceMonitor:
                    enabled: true
                    interval: 30s
                    scrapeTimeout: 3s
                    relabelings: []
                    metricRelabelings: []
                    selector: {}
                    scheme: ""
                    tlsConfig: {}
                    namespace: ""
                    labels:
                        release: kube-prometheus-stack
                    annotations: {}
        serviceAccount:
            create: true
            annotations: {}
            serviceAccountSecret:
                enabled: false
            fullnameOverride: authentik
        geoip:
            enabled: false
            editionIds: GeoLite2-City GeoLite2-ASN
            updateInterval: 8
            accountId: ""
            licenseKey: ""
            existingSecret:
                secretName: ""
                accountId: account_id
                licenseKey: license_key
            image:
                repository: ghcr.io/maxmind/geoipupdate
                tag: v8.0.0
                digest: ""
                pullPolicy: IfNotPresent
            env: []
            envFrom: []
            volumeMounts: []
            resources: {}
            containerSecurityContext: {}
        prometheus:
            rules:
                enabled: false
                namespace: ""
                selector: {}
                labels: {}
                annotations: {}
                additionalRuleGroupAnnotations: {}
        postgresql:
            enabled: true
            image:
                registry: docker.io
                repository: library/postgres
                tag: 18.6-bookworm
            auth:
                username: authentik
                database: authentik
            primary:
                args:
                    - -c
                    - config_file=/bitnami/postgresql/conf/postgresql.conf
                    - -c
                    - hba_file=/bitnami/postgresql/conf/pg_hba.conf
                configuration: |
                    listen_addresses = '*'
                    port = '5432'
                    wal_level = 'replica'
                    fsync = 'on'
                    hot_standby = 'on'
                    log_connections = 'false'
                    log_disconnections = 'false'
                    log_hostname = 'false'
                    client_min_messages = 'error'
                    include_dir = 'conf.d'
                pgHbaConfiguration: |
                    host     all             all             0.0.0.0/0               scram-sha-256
                    host     all             all             ::/0                    scram-sha-256
                    local    all             all                                     scram-sha-256
                    host     all             all        127.0.0.1/32                 scram-sha-256
                    host     all             all        ::1/128                      scram-sha-256
                extendedConfiguration: |
                    max_connections = 500
                extraEnvVars:
                    - name: POSTGRES_DB
                      value: '{{ (include "postgresql.v1.database" .) }}'
                resourcesPreset: none
                containerSecurityContext:
                    readOnlyRootFilesystem: true
                extraVolumeMounts:
                    - name: postgresql-socket
                      mountPath: /var/run/postgresql
                extraVolumes:
                    - name: postgresql-socket
                      emptyDir: {}
            readReplicas:
                resourcesPreset: none
            backup:
                resourcesPreset: none
            passwordUpdateJob:
                resourcesPreset: none
            volumePermissions:
                resourcesPreset: none
                image:
                    repository: debian
                    tag: 13-slim
            metrics:
                resourcesPreset: none
                image:
                    repository: prometheuscommunity/postgres-exporter
                    tag: v0.20.1
        redis:
            enabled: true
        additionalObjects: []
---
apiVersion: v1
kind: ConfigMap
metadata:
    name: authentik-dashboard
    namespace: kube-prometheus-stack
    labels:
        grafana_dashboard: "1"
data:
    authentik.json: |
        {
          "title": "authentik",
          "uid": "NJrtrc3Gk",
          "description": "Official authentik dashboard 14837, adapted: the Task status/Cached policies/System task duration panels used authentik_system_tasks and authentik_models, which no longer exist on this authentik version -- replaced with authentik_tasks_queued/authentik_tasks_workers and authentik_flows_execution_stage_time.",
          "tags": ["authentik"],
          "timezone": "browser",
          "schemaVersion": 39,
          "version": 1,
          "panels": [
            {
              "id": 2,
              "title": "PolicyEngine Execution time by binding type",
              "type": "timeseries",
              "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
              "fieldConfig": { "defaults": { "unit": "ms" } },
              "targets": [
                {
                  "expr": "avg by(binding_target_name, binding_target_type) (rate(authentik_policies_execution_time_sum[5m]) / rate(authentik_policies_execution_time_count[5m]))"
                }
              ]
            },
            {
              "id": 11,
              "title": "PolicyEngine Execution time by binding target",
              "type": "timeseries",
              "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
              "fieldConfig": { "defaults": { "unit": "ms" } },
              "targets": [
                {
                  "expr": "avg by(object_name, object_type) (rate(authentik_policies_execution_time_sum[5m]) / rate(authentik_policies_execution_time_count[5m]))"
                }
              ]
            },
            {
              "id": 100,
              "title": "Queued / worker tasks",
              "type": "stat",
              "gridPos": { "h": 4, "w": 6, "x": 0, "y": 8 },
              "targets": [
                { "expr": "authentik_tasks_queued", "legendFormat": "queued" },
                { "expr": "authentik_tasks_workers", "legendFormat": "workers" }
              ]
            },
            {
              "id": 6,
              "title": "Cached policies",
              "type": "stat",
              "gridPos": { "h": 4, "w": 6, "x": 6, "y": 8 },
              "targets": [{ "expr": "authentik_policies_cached" }]
            },
            {
              "id": 4,
              "title": "Connected Workers",
              "type": "stat",
              "gridPos": { "h": 4, "w": 6, "x": 12, "y": 8 },
              "fieldConfig": {
                "defaults": {
                  "mappings": [{ "type": "value", "options": { "0": { "text": "None" } } }]
                }
              },
              "targets": [{ "expr": "avg(authentik_admin_workers)" }]
            },
            {
              "id": 101,
              "title": "Connected outposts",
              "type": "stat",
              "gridPos": { "h": 4, "w": 6, "x": 18, "y": 8 },
              "targets": [{ "expr": "authentik_outposts_connected" }]
            },
            {
              "id": 15,
              "title": "Flow stage execution time by flow (p50/p95)",
              "type": "timeseries",
              "gridPos": { "h": 8, "w": 12, "x": 0, "y": 12 },
              "fieldConfig": { "defaults": { "unit": "ms" } },
              "targets": [
                {
                  "expr": "histogram_quantile(0.5, sum(rate(authentik_flows_execution_stage_time_bucket[5m])) by (le, flow_slug))",
                  "legendFormat": "{{flow_slug}} p50"
                },
                {
                  "expr": "histogram_quantile(0.95, sum(rate(authentik_flows_execution_stage_time_bucket[5m])) by (le, flow_slug))",
                  "legendFormat": "{{flow_slug}} p95"
                }
              ]
            },
            {
              "id": 8,
              "title": "FlowPlanner time by flow",
              "type": "timeseries",
              "gridPos": { "h": 8, "w": 12, "x": 12, "y": 12 },
              "fieldConfig": { "defaults": { "unit": "ms" } },
              "targets": [
                {
                  "expr": "avg by (flow_slug) (rate(authentik_flows_plan_time_sum[5m]) / rate(authentik_flows_plan_time_count[5m]))"
                }
              ]
            }
          ]
        }
