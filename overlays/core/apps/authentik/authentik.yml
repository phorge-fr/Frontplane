                  "exemplar": true,
                  "expr": "sum by (flow_slug) (rate(authentik_flows_plan_time_sum{namespace=~\"$namespace\"}[$__rate_interval]))",
                  "interval": "",
                  "legendFormat": "{{ stage_type }}",
                  "range": true,
                  "refId": "A"
                }
              ],
              "title": "FlowPlanner time by flow",
              "transparent": true,
              "type": "timeseries"
            },
            {
              "fieldConfig": {
                "defaults": {
                  "color": {
                    "mode": "palette-classic"
                  },
