apiVersion: v1
kind: Namespace
metadata:
    name: kube-prometheus-stack
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
    name: kube-prometheus-stack
    namespace: kube-prometheus-stack
spec:
    interval: 1m0s
    timeout: 15m0s
    url: https://prometheus-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: kube-prometheus-stack
    namespace: kube-prometheus-stack
spec:
    chart:
        spec:
            chart: kube-prometheus-stack
            sourceRef:
                kind: HelmRepository
                name: kube-prometheus-stack
            version: '91.4.0'
    interval: 1m0s
    valuesFrom:
        - kind: Secret
          name: grafana-oauth-secret
          valuesKey: adminPassword
          targetPath: grafana.adminPassword
    values:
        grafana:
            envFromSecret: grafana-oauth-secret
            grafana.ini:
                auth.generic_oauth:
                    enabled: true
                    name: Phorge
                    allow_sign_up: true
                    client_id: $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_ID}
                    client_secret: $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}
                    scopes: openid profile email groups offline_access
                    auth_url: https://auth.phorge.fr/application/o/authorize/
                    token_url: https://auth.phorge.fr/application/o/token/
                    api_url: https://auth.phorge.fr/application/o/userinfo/
                    login_attribute_path: preferred_username
                    name_attribute_path: name
                    email_attribute_path: email
                    role_attribute_path: contains(groups[*], 'grafana-admins') && 'Admin' || contains(groups[*], 'grafana-viewers') && 'Viewer' || 'None'
                    use_pkce: true
                server:
                    domain: monitoring.phorge.fr
                    root_url: https://monitoring.phorge.fr/
            enabled: true
            service:
                type: ClusterIP
            ingress:
                enabled: true
                ingressClassName: traefik-public
                annotations:
                    cert-manager.io/cluster-issuer: public-issuer
                hosts:
                    - monitoring.phorge.fr
                tls:
                    - secretName: grafana-tls
                      hosts:
                        - monitoring.phorge.fr
            persistence:
                enabled: false
            grafana:
                sidecar:
                    dashboards:
                        enabled: true
                        label: grafana_dashboard
                        labelValue: "1"
                        searchNamespace: kube-prometheus-stack
                        folder: /tmp/dashboards
                        enableDeletion: true
            additionalDataSources:
                - name: Loki
                  type: loki
                  access: proxy
                  url: http://loki.loki.svc.cluster.local:3100
                  isDefault: false
                  jsonData:
                    timeout: 60
                    maxLines: 1000
        prometheus:
            prometheusSpec:
                retention: 30d
                retentionSize: 35GiB
                enableRemoteWriteReceiver: true
                storageSpec:
                    volumeClaimTemplate:
                        spec:
                            storageClassName: longhorn
                            accessModes:
                                - ReadWriteOnce
                            resources:
                                requests:
                                    storage: 40Gi
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
    name: prometheus-basic-auth-middleware
    namespace: kube-prometheus-stack
spec:
    basicAuth:
        secret: prometheus-basic-auth-secret
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: prometheus
    namespace: kube-prometheus-stack
    annotations:
        traefik.ingress.kubernetes.io/router.middlewares: kube-prometheus-stack-prometheus-basic-auth-middleware@kubernetescrd
        cert-manager.io/cluster-issuer: local-issuer
        cert-manager.io/common-name: prometheus.core.phorge
spec:
    ingressClassName: traefik-local
    tls:
        - hosts:
            - prometheus.core.phorge
          secretName: prometheus-tls
    rules:
        - host: prometheus.core.phorge
          http:
            paths:
                - path: /api/v1/write
                  pathType: Exact
                  backend:
                    service:
                        name: kube-prometheus-stack-prometheus
                        port:
                            number: 9090
