apiVersion: v1
kind: ConfigMap
metadata:
    name: forgejo-dashboard
    namespace: kube-prometheus-stack
    annotations:
        grafana_folder: "Service"
    labels:
        grafana_dashboard: "1"
data:
    forgejo.json: |
        {
          "title": "Gitea Server Monitor",
          "uid": "forgejo-overview",
          "description": "Official dashboard 17802, adapted: job=\"gitea-http\" -> job=\"forgejo/forgejo\", PVC panel hardcoded to our forgejo-shared-storage claim on svc (dropped the $cluster/$namespace/$volume/metrics_path template vars), dropped Issues by Repository/by Label (gitea_issues_by_repository/by_label aren't exposed on this Forgejo version).",
          "tags": ["forgejo"],
          "timezone": "browser",
          "schemaVersion": 39,
          "version": 1,
          "panels": [
            { "id": 37, "title": "General", "type": "row", "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 } },
            {
              "id": 31,
              "title": "Memory Usage",
              "type": "timeseries",
              "gridPos": { "h": 7, "w": 8, "x": 0, "y": 1 },
              "fieldConfig": { "defaults": { "unit": "bytes" } },
              "targets": [{ "expr": "process_resident_memory_bytes{job=\"forgejo/forgejo\"}" }]
            },
            {
              "id": 32,
              "title": "CPU Usage",
              "type": "timeseries",
              "gridPos": { "h": 7, "w": 8, "x": 8, "y": 1 },
              "targets": [{ "expr": "irate(process_cpu_seconds_total{job=\"forgejo/forgejo\"}[1m])" }]
            },
            {
              "id": 33,
              "title": "PVC Storage (forgejo-shared-storage)",
              "type": "timeseries",
              "gridPos": { "h": 7, "w": 8, "x": 16, "y": 1 },
              "fieldConfig": { "defaults": { "unit": "bytes" } },
              "targets": [
                {
                  "expr": "kubelet_volume_stats_capacity_bytes{cluster=\"svc\", namespace=\"forgejo\", persistentvolumeclaim=\"forgejo-shared-storage\"} - kubelet_volume_stats_available_bytes{cluster=\"svc\", namespace=\"forgejo\", persistentvolumeclaim=\"forgejo-shared-storage\"}",
                  "legendFormat": "used"
                },
                {
                  "expr": "kubelet_volume_stats_available_bytes{cluster=\"svc\", namespace=\"forgejo\", persistentvolumeclaim=\"forgejo-shared-storage\"}",
                  "legendFormat": "available"
                }
              ]
            },
            {
              "id": 34,
              "title": "Uptime",
              "type": "stat",
              "gridPos": { "h": 3, "w": 3, "x": 0, "y": 8 },
              "fieldConfig": { "defaults": { "unit": "s" } },
              "targets": [{ "expr": "time() - max(process_start_time_seconds{job=\"forgejo/forgejo\"})" }]
            },
            { "id": 21, "title": "Organizations", "type": "stat", "gridPos": { "h": 3, "w": 3, "x": 3, "y": 8 }, "targets": [{ "expr": "gitea_organizations" }] },
            { "id": 16, "title": "Teams", "type": "stat", "gridPos": { "h": 3, "w": 3, "x": 6, "y": 8 }, "targets": [{ "expr": "gitea_teams" }] },
            { "id": 24, "title": "Users", "type": "stat", "gridPos": { "h": 3, "w": 3, "x": 9, "y": 8 }, "targets": [{ "expr": "gitea_users" }] },
            { "id": 3, "title": "Milestones", "type": "stat", "gridPos": { "h": 3, "w": 3, "x": 12, "y": 8 }, "targets": [{ "expr": "gitea_milestones" }] },
            { "id": 17, "title": "Stars", "type": "stat", "gridPos": { "h": 3, "w": 3, "x": 15, "y": 8 }, "targets": [{ "expr": "gitea_stars" }] },
            { "id": 25, "title": "Watches", "type": "stat", "gridPos": { "h": 3, "w": 3, "x": 18, "y": 8 }, "targets": [{ "expr": "gitea_watches" }] },
            { "id": 18, "title": "Repositories", "type": "stat", "gridPos": { "h": 3, "w": 3, "x": 3, "y": 11 }, "targets": [{ "expr": "gitea_repositories" }] },
            { "id": 19, "title": "Releases", "type": "stat", "gridPos": { "h": 3, "w": 3, "x": 6, "y": 11 }, "targets": [{ "expr": "gitea_releases" }] },
            { "id": 5, "title": "Issues Open", "type": "stat", "gridPos": { "h": 3, "w": 3, "x": 9, "y": 11 }, "targets": [{ "expr": "gitea_issues_open" }] },
            { "id": 35, "title": "Issues Closed", "type": "stat", "gridPos": { "h": 3, "w": 3, "x": 12, "y": 11 }, "targets": [{ "expr": "gitea_issues_closed" }] },
            { "id": 10, "title": "Labels", "type": "stat", "gridPos": { "h": 3, "w": 3, "x": 15, "y": 11 }, "targets": [{ "expr": "gitea_labels" }] },
            { "id": 7, "title": "Comments", "type": "stat", "gridPos": { "h": 3, "w": 3, "x": 18, "y": 11 }, "targets": [{ "expr": "gitea_comments" }] }
          ]
        }
