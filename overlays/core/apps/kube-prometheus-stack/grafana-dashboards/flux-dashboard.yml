                      "exported_namespace": "Namespace",
                      "name": "Name",
                      "ready": "Ready",
                      "suspended": "Suspended",
                      "revision": "Revision"
                    },
                    "indexByName": {
                      "cluster": 0,
                      "customresource_kind": 1,
                      "exported_namespace": 2,
                      "name": 3,
                      "ready": 4,
                      "suspended": 5,
                      "revision": 6
                    }
                  }
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "noValue": "Nothing to show",
                  "custom": {
                    "align": "auto",
                    "cellOptions": {
                      "type": "auto"
                    },
                    "filterable": true
                  }
                },
                "overrides": [
                  {
                    "matcher": {
                      "id": "byName",
                      "options": "Ready"
