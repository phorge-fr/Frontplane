                    },
                    "properties": [
                      {
                        "id": "custom.width",
                        "value": 150
                      }
                    ]
                  }
                ]
              },
              "options": {
                "showHeader": true,
                "cellHeight": "sm",
                "sortBy": [
                  {
                    "displayName": "Kind",
                    "desc": false
                  }
                ]
              },
              "description": "Revision is the applied revision for a Kustomization, the artifact revision for a source and the chart version for a HelmRelease."
            },
            {
              "id": 7,
              "type": "timeseries",
              "title": "Reconciliations per second, by kind",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "gridPos": {
                "h": 8,
                "w": 12,
                "x": 0,
                "y": 23
              },
              "targets": [
                {
                  "refId": "A",
                  "datasource": {
                    "type": "prometheus",
                    "uid": "prometheus"
                  },
                  "expr": "sum by (cluster, kind) (rate(gotk_reconcile_duration_seconds_count{cluster=~\"$cluster\",job=\"flux-system/flux-system\"}[5m]))",
                  "instant": false,
                  "range": true,
                  "legendFormat": "{{cluster}} {{kind}}"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "unit": "ops",
                  "custom": {
                    "drawStyle": "line",
                    "lineWidth": 1,
                    "fillOpacity": 10,
                    "showPoints": "never",
                    "spanNulls": false
                  },
                  "min": 0
                },
                "overrides": []
              },
              "options": {
                "legend": {
                  "displayMode": "list",
                  "placement": "bottom"
                },
                "tooltip": {
                  "mode": "multi",
                  "sort": "desc"
                }
              }
            },
            {
