apiVersion: v1
kind: ConfigMap
metadata:
    name: cert-manager-dashboard
    namespace: kube-prometheus-stack
    annotations:
        grafana_folder: "Cluster health"
    labels:
        grafana_dashboard: "1"
data:
    cert-manager.json: |
        {
          "uid": "cert-manager",
          "title": "cert-manager",
          "description": "Certificates issued by cert-manager on every cluster: expiry, readiness and the controller's sync errors.",
          "tags": [
            "cert-manager"
          ],
          "schemaVersion": 39,
          "version": 1,
          "editable": true,
          "graphTooltip": 1,
          "refresh": "1m",
          "time": {
            "from": "now-7d",
            "to": "now"
          },
          "timezone": "browser",
          "templating": {
            "list": [
              {
                "name": "cluster",
                "label": "Cluster",
                "type": "query",
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "query": {
                  "query": "label_values(certmanager_certificate_expiration_timestamp_seconds, cluster)",
                  "refId": "PromVar"
                },
                "definition": "label_values(certmanager_certificate_expiration_timestamp_seconds, cluster)",
                "includeAll": true,
                "multi": true,
                "allValue": ".*",
                "refresh": 2,
                "sort": 1,
                "current": {
                  "selected": true,
                  "text": [
                    "All"
                  ],
                  "value": [
                    "$__all"
                  ]
                }
              }
            ]
          },
          "annotations": {
            "list": []
          },
          "links": [],
          "panels": [
            {
              "id": 1,
              "type": "stat",
              "title": "Certificates",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "gridPos": {
                "h": 4,
                "w": 6,
                "x": 0,
                "y": 0
              },
              "targets": [
                {
                  "refId": "A",
                  "datasource": {
                    "type": "prometheus",
                    "uid": "prometheus"
                  },
                  "expr": "count(certmanager_certificate_expiration_timestamp_seconds{cluster=~\"$cluster\"}) or vector(0)",
                  "instant": true,
                  "range": false
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "noValue": "0",
                  "unit": "none",
                  "decimals": 0,
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      {
                        "color": "blue",
                        "value": null
                      }
                    ]
                  }
                },
                "overrides": []
              },
              "options": {
                "colorMode": "background",
                "graphMode": "none",
                "textMode": "value",
                "justifyMode": "center",
                "reduceOptions": {
                  "calcs": [
                    "lastNotNull"
                  ],
                  "fields": "",
                  "values": false
                }
              }
            },
            {
              "id": 2,
              "type": "stat",
              "title": "Not ready",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "gridPos": {
                "h": 4,
                "w": 6,
                "x": 6,
                "y": 0
              },
              "targets": [
                {
                  "refId": "A",
                  "datasource": {
                    "type": "prometheus",
                    "uid": "prometheus"
                  },
                  "expr": "count(max by (cluster, exported_namespace, name) (certmanager_certificate_ready_status{condition!=\"True\",cluster=~\"$cluster\"}) == 1) or vector(0)",
                  "instant": true,
                  "range": false
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "noValue": "0",
                  "unit": "none",
                  "decimals": 0,
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      {
                        "color": "green",
                        "value": null
                      },
                      {
                        "color": "red",
                        "value": 1
                      }
                    ]
                  }
                },
                "overrides": []
              },
              "options": {
                "colorMode": "background",
                "graphMode": "none",
                "textMode": "value",
                "justifyMode": "center",
                "reduceOptions": {
                  "calcs": [
                    "lastNotNull"
                  ],
                  "fields": "",
                  "values": false
                }
              }
            },
            {
              "id": 3,
              "type": "stat",
              "title": "Expiring within 21 days",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "gridPos": {
                "h": 4,
                "w": 6,
                "x": 12,
                "y": 0
              },
              "targets": [
                {
                  "refId": "A",
                  "datasource": {
                    "type": "prometheus",
                    "uid": "prometheus"
                  },
                  "expr": "count((certmanager_certificate_expiration_timestamp_seconds{cluster=~\"$cluster\"} - time()) < 21 * 86400) or vector(0)",
                  "instant": true,
                  "range": false
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "noValue": "0",
                  "unit": "none",
                  "decimals": 0,
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      {
                        "color": "green",
                        "value": null
                      },
                      {
                        "color": "orange",
                        "value": 1
                      }
                    ]
                  }
                },
                "overrides": []
              },
              "options": {
                "colorMode": "background",
                "graphMode": "none",
                "textMode": "value",
                "justifyMode": "center",
                "reduceOptions": {
                  "calcs": [
                    "lastNotNull"
                  ],
                  "fields": "",
                  "values": false
                }
              },
              "description": "A renewal that fails leaves the Certificate ready until it expires. cert-manager renews 30 days before expiry by default."
            },
            {
              "id": 4,
              "type": "stat",
              "title": "Next expiry (days)",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "gridPos": {
                "h": 4,
                "w": 6,
                "x": 18,
                "y": 0
              },
              "targets": [
                {
                  "refId": "A",
                  "datasource": {
                    "type": "prometheus",
                    "uid": "prometheus"
                  },
                  "expr": "min(certmanager_certificate_expiration_timestamp_seconds{cluster=~\"$cluster\"} - time()) / 86400",
                  "instant": true,
                  "range": false
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "noValue": "0",
                  "unit": "none",
                  "decimals": 0,
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      {
                        "color": "green",
                        "value": null
                      }
                    ]
                  }
                },
                "overrides": []
              },
              "options": {
                "colorMode": "background",
                "graphMode": "none",
                "textMode": "value",
                "justifyMode": "center",
                "reduceOptions": {
                  "calcs": [
                    "lastNotNull"
                  ],
                  "fields": "",
                  "values": false
                }
              }
            },
            {
              "id": 5,
              "type": "table",
              "title": "Certificates",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "gridPos": {
                "h": 9,
                "w": 24,
                "x": 0,
                "y": 4
              },
              "targets": [
                {
                  "refId": "A",
                  "datasource": {
                    "type": "prometheus",
                    "uid": "prometheus"
                  },
                  "expr": "max by (cluster, exported_namespace, name, issuer_name) (certmanager_certificate_expiration_timestamp_seconds{cluster=~\"$cluster\"} - time()) / 86400",
                  "instant": true,
                  "range": false,
                  "format": "table"
                },
                {
                  "refId": "B",
                  "datasource": {
                    "type": "prometheus",
                    "uid": "prometheus"
                  },
                  "expr": "max by (cluster, exported_namespace, name) (certmanager_certificate_renewal_timestamp_seconds{cluster=~\"$cluster\"} - time()) / 86400",
                  "instant": true,
                  "range": false,
                  "format": "table"
                },
                {
                  "refId": "C",
                  "datasource": {
                    "type": "prometheus",
                    "uid": "prometheus"
                  },
                  "expr": "max by (cluster, exported_namespace, name) (certmanager_certificate_ready_status{condition=\"True\",cluster=~\"$cluster\"})",
                  "instant": true,
                  "range": false,
                  "format": "table"
                }
              ],
              "transformations": [
                {
                  "id": "merge",
                  "options": {}
                },
                {
                  "id": "filterFieldsByName",
                  "options": {
                    "include": {
                      "names": [
                        "cluster",
                        "exported_namespace",
                        "name",
                        "issuer_name",
                        "Value #A",
                        "Value #B",
                        "Value #C"
                      ]
                    }
                  }
                },
                {
                  "id": "organize",
                  "options": {
                    "excludeByName": {},
                    "renameByName": {
                      "exported_namespace": "Namespace",
                      "name": "Certificate",
                      "issuer_name": "Issuer",
                      "cluster": "Cluster",
                      "Value #A": "Expires in (days)",
                      "Value #B": "Renews in (days)",
                      "Value #C": "Ready"
                    },
                    "indexByName": {
                      "cluster": 0,
                      "exported_namespace": 1,
                      "name": 2,
                      "issuer_name": 3,
                      "Value #C": 4,
                      "Value #A": 5,
                      "Value #B": 6
                    }
                  }
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "noValue": "Nothing to show",
                  "custom": {
                    "align": "auto",
                    "cellOptions": {
                      "type": "auto"
                    },
                    "filterable": true
                  }
                },
                "overrides": [
                  {
                    "matcher": {
                      "id": "byName",
                      "options": "Expires in (days)"
                    },
                    "properties": [
                      {
                        "id": "decimals",
                        "value": 0
                      },
                      {
                        "id": "custom.width",
                        "value": 175
                      },
                      {
                        "id": "thresholds",
                        "value": {
                          "mode": "absolute",
                          "steps": [
                            {
                              "color": "red",
                              "value": null
                            },
                            {
                              "color": "orange",
                              "value": 7
                            },
                            {
                              "color": "yellow",
                              "value": 21
                            },
                            {
                              "color": "green",
                              "value": 30
                            }
                          ]
                        }
                      },
                      {
                        "id": "custom.cellOptions",
                        "value": {
                          "type": "color-text"
                        }
                      }
                    ]
                  },
                  {
                    "matcher": {
                      "id": "byName",
                      "options": "Renews in (days)"
                    },
                    "properties": [
                      {
                        "id": "decimals",
                        "value": 0
                      },
                      {
                        "id": "custom.width",
                        "value": 175
                      }
                    ]
                  },
                  {
                    "matcher": {
                      "id": "byName",
                      "options": "Ready"
                    },
                    "properties": [
                      {
                        "id": "custom.width",
                        "value": 90
                      },
                      {
                        "id": "custom.cellOptions",
                        "value": {
                          "type": "color-text"
                        }
                      },
                      {
                        "id": "mappings",
                        "value": [
                          {
                            "type": "value",
                            "options": {
                              "1": {
                                "text": "Yes",
                                "color": "green",
                                "index": 0
                              },
                              "0": {
                                "text": "No",
                                "color": "red",
                                "index": 1
                              }
                            }
                          }
                        ]
                      }
                    ]
                  }
                ]
              },
              "options": {
                "showHeader": true,
                "cellHeight": "sm",
                "sortBy": [
                  {
                    "displayName": "Expires in (days)",
                    "desc": false
                  }
                ]
              }
            },
            {
              "id": 6,
              "type": "timeseries",
              "title": "Days before expiry",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "gridPos": {
                "h": 8,
                "w": 24,
                "x": 0,
                "y": 13
              },
              "targets": [
                {
                  "refId": "A",
                  "datasource": {
                    "type": "prometheus",
                    "uid": "prometheus"
                  },
                  "expr": "((certmanager_certificate_expiration_timestamp_seconds{cluster=~\"$cluster\"} - time()) / 86400) < 120",
                  "instant": false,
                  "range": true,
                  "legendFormat": "{{cluster}} {{exported_namespace}}/{{name}}"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "unit": "none",
                  "custom": {
                    "drawStyle": "line",
                    "lineWidth": 1,
                    "fillOpacity": 10,
                    "showPoints": "never",
                    "spanNulls": false,
                    "thresholdsStyle": {
                      "mode": "line"
                    }
                  },
                  "min": 0,
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      {
                        "color": "transparent",
                        "value": null
                      },
                      {
                        "color": "orange",
                        "value": 21
                      }
                    ]
                  }
                },
                "overrides": []
              },
              "options": {
                "legend": {
                  "displayMode": "list",
                  "placement": "bottom"
                },
                "tooltip": {
                  "mode": "multi",
                  "sort": "desc"
                }
              },
              "description": "Days left on the certificates that expire within 120 days (the root CA lasts ten years and would flatten the graph). The line is the 21 days threshold of the warning."
            },
            {
              "id": 7,
              "type": "timeseries",
              "title": "Controller sync errors",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "gridPos": {
                "h": 8,
                "w": 12,
                "x": 0,
                "y": 21
              },
              "targets": [
                {
                  "refId": "A",
                  "datasource": {
                    "type": "prometheus",
                    "uid": "prometheus"
                  },
                  "expr": "sum by (cluster, controller) (rate(certmanager_controller_sync_error_count{cluster=~\"$cluster\"}[5m]))",
                  "instant": false,
                  "range": true,
                  "legendFormat": "{{cluster}} {{controller}}"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "unit": "ops",
                  "custom": {
                    "drawStyle": "line",
                    "lineWidth": 1,
                    "fillOpacity": 10,
                    "showPoints": "never",
                    "spanNulls": false
                  },
                  "min": 0
                },
                "overrides": []
              },
              "options": {
                "legend": {
                  "displayMode": "list",
                  "placement": "bottom"
                },
                "tooltip": {
                  "mode": "multi",
                  "sort": "desc"
                }
              }
            },
            {
              "id": 8,
              "type": "timeseries",
              "title": "ACME requests by status",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "gridPos": {
                "h": 8,
                "w": 12,
                "x": 12,
                "y": 21
              },
              "targets": [
                {
                  "refId": "A",
                  "datasource": {
                    "type": "prometheus",
                    "uid": "prometheus"
                  },
                  "expr": "sum by (cluster, status) (rate(certmanager_http_acme_client_request_count{cluster=~\"$cluster\"}[15m]))",
                  "instant": false,
                  "range": true,
                  "legendFormat": "{{cluster}} {{status}}"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "unit": "ops",
                  "custom": {
                    "drawStyle": "line",
                    "lineWidth": 1,
                    "fillOpacity": 10,
                    "showPoints": "never",
                    "spanNulls": false
                  },
                  "min": 0
                },
                "overrides": []
              },
              "options": {
                "legend": {
                  "displayMode": "list",
                  "placement": "bottom"
                },
                "tooltip": {
                  "mode": "multi",
                  "sort": "desc"
                }
              },
              "description": "Requests to the ACME server (Let's Encrypt). 429 means the rate limits are hit."
            }
          ]
        }
