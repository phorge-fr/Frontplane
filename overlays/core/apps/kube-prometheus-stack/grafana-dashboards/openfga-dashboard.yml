apiVersion: v1
kind: ConfigMap
metadata:
    name: openfga-dashboard
    namespace: kube-prometheus-stack
    annotations:
        grafana_folder: "Core"
    labels:
        grafana_dashboard: "1"
data:
    openfga.json: |
        {
          "title": "OpenFGA Dashboard",
          "uid": "openfga-overview",
          "description": "Official dashboard from github.com/openfga/openfga/telemetry/grafana/dashboards/openfga.json. Enabled telemetry.metrics.enableRPCHistograms (was off by default, no cost otherwise) to get real p50/p90/p99 request latency instead of dropping those panels. Fixed the cache hit ratio panel's metric names to match this OpenFGA version (openfga_check_cache_hit_count / openfga_check_cache_total_count, no _total suffix). Dropped the SQL metrics panel: go_sql_* isn't exposed by this OpenFGA build at all.",
          "tags": ["openfga"],
          "timezone": "browser",
          "schemaVersion": 39,
          "version": 1,
          "panels": [
            { "id": 100, "title": "Server Metrics", "type": "row", "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 } },
            {
              "id": 1,
              "title": "p50 Request Duration by Method",
              "type": "timeseries",
              "gridPos": { "h": 8, "w": 8, "x": 0, "y": 1 },
              "fieldConfig": { "defaults": { "unit": "s" } },
              "targets": [
                {
                  "expr": "histogram_quantile(0.5, sum by(le, grpc_method, grpc_service) (rate(grpc_server_handling_seconds_bucket{job=\"openfga\", grpc_type=\"unary\", grpc_service=\"openfga.v1.OpenFGAService\"}[2m])))",
                  "legendFormat": "{{grpc_method}}"
                }
              ]
            },
            {
              "id": 2,
              "title": "p90 Request Duration by Method",
              "type": "timeseries",
              "gridPos": { "h": 8, "w": 8, "x": 8, "y": 1 },
              "fieldConfig": { "defaults": { "unit": "s" } },
              "targets": [
                {
                  "expr": "histogram_quantile(0.9, sum by(le, grpc_method, grpc_service) (rate(grpc_server_handling_seconds_bucket{job=\"openfga\", grpc_type=\"unary\", grpc_service=\"openfga.v1.OpenFGAService\"}[2m])))",
                  "legendFormat": "{{grpc_method}}"
                }
              ]
            },
            {
              "id": 3,
              "title": "p99 Request Duration by Method",
              "type": "timeseries",
              "gridPos": { "h": 8, "w": 8, "x": 16, "y": 1 },
              "fieldConfig": { "defaults": { "unit": "s" } },
              "targets": [
                {
                  "expr": "histogram_quantile(0.99, sum by(le, grpc_method, grpc_service) (rate(grpc_server_handling_seconds_bucket{job=\"openfga\", grpc_type=\"unary\", grpc_service=\"openfga.v1.OpenFGAService\"}[2m])))",
                  "legendFormat": "{{grpc_method}}"
                }
              ]
            },
            {
              "id": 4,
              "title": "RPS per Method",
              "type": "timeseries",
              "gridPos": { "h": 8, "w": 8, "x": 0, "y": 9 },
              "targets": [
                {
                  "expr": "sum(rate(grpc_server_started_total{job=\"openfga\",grpc_service=\"openfga.v1.OpenFGAService\"}[1m])) by (grpc_method)",
                  "legendFormat": "{{grpc_method}}"
                }
              ]
            },
            {
              "id": 5,
              "title": "Status Code Count per Method",
              "type": "timeseries",
              "gridPos": { "h": 8, "w": 8, "x": 8, "y": 9 },
              "targets": [
                {
                  "expr": "sum by(grpc_code, grpc_method) (rate(grpc_server_handled_total{grpc_service=\"openfga.v1.OpenFGAService\"}[1m]))",
                  "legendFormat": "{{grpc_method}} - {{grpc_code}}"
                }
              ]
            },
            {
              "id": 6,
              "title": "Check Cache Hit Ratio",
              "type": "timeseries",
              "gridPos": { "h": 8, "w": 8, "x": 16, "y": 9 },
              "fieldConfig": { "defaults": { "unit": "percent", "max": 100, "min": 0 } },
              "targets": [
                {
                  "expr": "(sum(increase(openfga_check_cache_hit_count[1m])) / sum(increase(openfga_check_cache_total_count[1m]))) * 100"
                }
              ]
            },
            { "id": 101, "title": "Go Runtime Metrics", "type": "row", "gridPos": { "h": 1, "w": 24, "x": 0, "y": 25 } },
            {
              "id": 8,
              "title": "Goroutines",
              "type": "timeseries",
              "gridPos": { "h": 8, "w": 12, "x": 0, "y": 26 },
              "targets": [
                { "expr": "go_goroutines{job=\"openfga\"}", "legendFormat": "count" },
                { "expr": "irate(go_goroutines{job=\"openfga\"}[2m])", "legendFormat": "rate of change" }
              ]
            },
            {
              "id": 9,
              "title": "Go GC Duration",
              "type": "timeseries",
              "gridPos": { "h": 8, "w": 12, "x": 12, "y": 26 },
              "fieldConfig": { "defaults": { "unit": "s" } },
              "targets": [
                { "expr": "go_gc_duration_seconds{job=\"openfga\", quantile=\"0.5\"}", "legendFormat": "p50" },
                { "expr": "go_gc_duration_seconds{job=\"openfga\", quantile=\"0.75\"}", "legendFormat": "p75" },
                { "expr": "go_gc_duration_seconds{job=\"openfga\", quantile=\"1\"}", "legendFormat": "max" }
              ]
            },
            {
              "id": 10,
              "title": "Heap Memory Usage",
              "type": "timeseries",
              "gridPos": { "h": 8, "w": 8, "x": 0, "y": 34 },
              "fieldConfig": { "defaults": { "unit": "bytes" } },
              "targets": [{ "expr": "go_memstats_heap_alloc_bytes{job=\"openfga\"}" }]
            },
            {
              "id": 11,
              "title": "Memory Allocation Rate (malloc/sec)",
              "type": "timeseries",
              "gridPos": { "h": 8, "w": 8, "x": 8, "y": 34 },
              "targets": [{ "expr": "rate(go_memstats_mallocs_total{job=\"openfga\"}[2m])" }]
            },
            {
              "id": 12,
              "title": "Heap Allocation Rate (bytes/sec)",
              "type": "timeseries",
              "gridPos": { "h": 8, "w": 8, "x": 16, "y": 34 },
              "fieldConfig": { "defaults": { "unit": "Bps" } },
              "targets": [{ "expr": "rate(go_memstats_alloc_bytes_total{job=\"openfga\"}[2m])" }]
            }
          ]
        }
