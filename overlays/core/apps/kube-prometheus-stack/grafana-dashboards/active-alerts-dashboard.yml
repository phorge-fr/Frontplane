apiVersion: v1
kind: ConfigMap
metadata:
    name: active-alerts-dashboard
    namespace: kube-prometheus-stack
    annotations:
        grafana_folder: "Alerting"
    labels:
        grafana_dashboard: "1"
data:
    active-alerts.json: |
        {
          "uid": "active-alerts",
          "title": "Active alerts",
          "description": "Active Prometheus alerts by severity (firing and pending), all clusters, from the ALERTS series.",
          "tags": [
            "alerting"
          ],
          "schemaVersion": 39,
          "version": 2,
          "editable": true,
          "graphTooltip": 1,
          "refresh": "1m",
          "time": {
            "from": "now-24h",
            "to": "now"
          },
          "timezone": "browser",
          "templating": {
            "list": [
              {
                "name": "cluster",
                "label": "Cluster",
                "type": "query",
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "query": {
                  "query": "label_values(ALERTS, cluster)",
                  "refId": "PromVar"
                },
                "definition": "label_values(ALERTS, cluster)",
                "includeAll": true,
                "multi": true,
                "allValue": ".*",
                "refresh": 2,
                "sort": 1,
                "current": {
                  "selected": true,
                  "text": [
                    "All"
                  ],
                  "value": [
                    "$__all"
                  ]
                }
              }
            ]
          },
          "annotations": {
            "list": []
          },
          "links": [],
          "panels": [
            {
              "id": 1,
              "type": "stat",
              "title": "Critical",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "gridPos": {
                "h": 4,
                "w": 6,
                "x": 0,
                "y": 0
              },
              "targets": [
                {
                  "refId": "A",
                  "datasource": {
                    "type": "prometheus",
                    "uid": "prometheus"
                  },
                  "expr": "count(ALERTS{alertstate=\"firing\",severity=\"critical\",alertname!~\"Watchdog|InfoInhibitor\",cluster=~\"$cluster\"}) or vector(0)",
                  "instant": false,
                  "range": true
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "noValue": "0",
                  "unit": "none",
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      {
                        "color": "green",
                        "value": null
                      },
                      {
                        "color": "red",
                        "value": 1
                      }
                    ]
                  }
                },
                "overrides": []
              },
              "options": {
                "colorMode": "background",
                "graphMode": "none",
                "textMode": "value",
                "justifyMode": "center",
                "reduceOptions": {
                  "calcs": [
                    "lastNotNull"
