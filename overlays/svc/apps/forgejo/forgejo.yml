apiVersion: v1
kind: Namespace
metadata:
    name: forgejo
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
    name: forgejo
    namespace: forgejo
spec:
    interval: 1m0s
    timeout: 1m0s
    type: oci
    url: oci://code.forgejo.org/forgejo-helm
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: forgejo
    namespace: forgejo
spec:
    chart:
        spec:
            chart: forgejo
            sourceRef:
                kind: HelmRepository
                name: forgejo
            version: 17.1.7
    interval: 1m0s
    timeout: 10m0s
    values:
        image:
            # renovate: datasource=docker depName=code.forgejo.org/forgejo/forgejo
            tag: 16.0.4-rootless
        podSecurityContext:
            fsGroupChangePolicy: OnRootMismatch
        initPreScript: |
            if [ ! -f /data/gitea/.phorge-theme-installed ]; then
                wget -O /tmp/main.zip https://github.com/phorge-fr/gitea-phorge-theme/archive/refs/heads/main.zip
                unzip -n /tmp/main.zip -d /tmp/
                mkdir -p /data/gitea
                cp -r /tmp/gitea-phorge-theme-main/* /data/gitea/
                touch /data/gitea/.phorge-theme-installed
            fi
        gitea:
            metrics:
                enabled: true
            admin:
                email: l-nmch@phorge.fr
                existingSecret: forgejo-admin-secret
                passwordMode: keepUpdated
            config:
                APP_NAME: φorge
                server:
                    SSH_LISTEN_PORT: 2222
                    SSH_PORT: 22
                    ROOT_URL: https://git.phorge.fr/
                service:
                    DISABLE_REGISTRATION: "true"
                    ENABLE_INTERNAL_SIGNIN: "false"
                    ENABLE_BASIC_AUTHENTICATION: "false"
                ui:
                    THEMES: phorge-dark
                    DEFAULT_THEME: phorge-dark
                repository:
                    ACCESS_CONTROL_ALLOW_ORIGIN: '*'
                oauth2_client:
                    ENABLE_AUTO_REGISTRATION: "true"
                    USERNAME: nickname
                storage: {}
        ingress:
            annotations:
                cert-manager.io/cluster-issuer: public-issuer
            className: traefik-public
            enabled: true
            hosts:
                - host: git.phorge.fr
                  paths:
                    - path: /
                      pathType: Prefix
                      port: http
            tls:
                - hosts:
                    - git.phorge.fr
                  secretName: forgejo-tls
        persistence:
            accessModes:
                - ReadWriteOnce
            annotations:
                helm.sh/resource-policy: keep
            claimName: forgejo-shared-storage
            create: true
            enabled: true
            labels: {}
            mount: true
            size: 10Gi
            storageClass: nfs
            subPath: null
            volumeName: ""
        service:
            ssh:
                annotations: {}
                clusterIP: null
                externalIPs: null
                externalTrafficPolicy: null
                hostPort: null
                ipFamilies: null
                ipFamilyPolicy: null
                labels: {}
                loadBalancerClass: null
                loadBalancerIP: 10.3.0.13
                loadBalancerSourceRanges: []
                nodePort: null
                port: 22
                type: LoadBalancer
        signing:
            enabled: false
            existingSecret: ""
            gpgHome: /data/git/.gnupg
            privateKey: ""
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
    name: forgejo
    namespace: forgejo
spec:
    selector:
        matchLabels:
            app.kubernetes.io/name: forgejo
    podMetricsEndpoints:
        - port: http
          path: /metrics
          interval: 30s
