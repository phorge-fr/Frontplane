apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: forgejo
    namespace: forgejo
spec:
    chart:
        spec:
            chart: forgejo
            sourceRef:
                kind: HelmRepository
                name: forgejo
            version: '*'
    interval: 1m0s
    timeout: 10m0s
    values:
        securityContext:
            fsGroupChangePolicy: OnRootMismatch
        initPreScript: |
            wget -O /tmp/main.zip https://github.com/phorge-fr/gitea-phorge-theme/archive/refs/heads/main.zip
            unzip -n /tmp/main.zip -d /tmp/
            mkdir -p /data/gitea
            cp -r /tmp/gitea-phorge-theme-main/* /data/gitea/
        gitea:
            admin:
                email: ENC[AES256_GCM,data:nNoRu7oolco6BkdSm1Rueg==,iv:uop+pfD2kYCf+DAiTa7wXaatsirs9qXMOOtOV2PIjjs=,tag:EymzSwVdL7swJVL6Qj4wtg==,type:str]
                password: ENC[AES256_GCM,data:H3Hygl82ufsb/rSzyP7NoHWBfOs=,iv:36u208KaMQ60Kp+pG7FnoPoKGGLZybF2vMtf8sM0foY=,tag:HCyfgdhbDNkx9sxehfJmGg==,type:str]
                passwordMode: keepUpdated
                username: ENC[AES256_GCM,data:7anBIt9R8fSHoHM=,iv:Tx8O0MFBHHMGBTgm9mhKCfCbJASWlW34PTcPjsYHm0s=,tag:kN7L9nvsfYx2+yCMked5Vw==,type:str]
            config:
                APP_NAME: φorge
                server:
                    SSH_LISTEN_PORT: 2222
                    SSH_PORT: 22
                    ROOT_URL: https://git.phorge.fr/
                service:
                    DISABLE_REGISTRATION: "true"
                    ENABLE_INTERNAL_SIGNIN: "false"
                    ENABLE_BASIC_AUTHENTICATION: "false"
                ui:
                    THEMES: phorge-dark
                    DEFAULT_THEME: phorge-dark
                repository:
                    ACCESS_CONTROL_ALLOW_ORIGIN: '*'
                oauth2_client:
                    ENABLE_AUTO_REGISTRATION: "true"
                    USERNAME: nickname
                storage: {}
        ingress:
            annotations:
                cert-manager.io/cluster-issuer: public-issuer
            className: traefik-public
            enabled: true
            hosts:
                - host: git.phorge.fr
                  paths:
                    - path: /
                      pathType: Prefix
                      port: http
            tls:
                - hosts:
                    - git.phorge.fr
                  secretName: forgejo-tls
        persistence:
            accessModes:
                - ReadWriteOnce
            annotations:
                helm.sh/resource-policy: keep
            claimName: forgejo-shared-storage
            create: true
            enabled: true
            labels: {}
            mount: true
            size: 10Gi
            storageClass: nfs
            subPath: null
            volumeName: ""
        service:
            ssh:
                annotations: {}
                clusterIP: null
                externalIPs: null
                externalTrafficPolicy: null
                hostPort: null
                ipFamilies: null
                ipFamilyPolicy: null
                labels: {}
                loadBalancerClass: null
                loadBalancerIP: 10.3.0.13
                loadBalancerSourceRanges: []
                nodePort: null
                port: 22
                type: LoadBalancer
        signing:
            enabled: false
            existingSecret: ""
            gpgHome: /data/git/.gnupg
            privateKey: ""
