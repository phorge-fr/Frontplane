apiVersion: k0sctl.k0sproject.io/v1beta1
kind: Cluster
metadata:
    name: svc
    user: phorge-admin
spec:
    k0s:
        version: 1.36.4+k0s.0
        config:
            apiVersion: k0s.k0sproject.io/v1beta1
            kind: Cluster
            metadata:
                name: k0s
            spec:
                api:
                    k0sApiPort: 9443
                    port: 6443
                    sans:
                        - 10.3.0.4
                    extraArgs:
                        # See clusters/control/setup/k0s-cluster.yml: same tuning, validated there
                        # first (apiserver RSS 0.87-1.27 GiB before, sustained 0.85-0.95 GiB after,
                        # cluster healthy throughout). Real object counts here never exceed a few
                        # hundred per type; the default reserves 100 per type regardless.
                        default-watch-cache-size: "20"
                network:
                    provider: custom
                    kubeProxy:
                        disabled: true
                    podCIDR: 10.244.0.0/16
                    serviceCIDR: 10.96.0.0/12
                    controlPlaneLoadBalancing:
                        enabled: true
                        type: Keepalived
                        keepalived:
                            vrrpInstances:
                                - virtualIPs:
                                      - 10.3.0.4/24
                                  authPass: ENC[AES256_GCM,data:WVjlyK+fEV0=,iv:na+zw4Tsli9LUcGdgksrTdORRApBYFZfpv21zM25L+o=,tag:naPLhNaxVQKKP2UBNmcQYg==,type:str]
                                  interface: end0
                    nodeLocalLoadBalancing:
                        enabled: true
                        type: Traefik
                storage:
                    type: etcd
                    etcd:
                        extraArgs:
                            listen-peer-urls: https://0.0.0.0:2380
                            listen-client-urls: https://0.0.0.0:2379
                            listen-metrics-urls: http://127.0.0.1:2381
                telemetry:
                    enabled: false
    hosts:
        - ssh:
              address: 10.3.0.1
              user: root
              port: 22
          role: controller+worker
          installFlags:
              - --disable-components=konnectivity-server
              - --kubelet-extra-args=--image-gc-high-threshold=50 --image-gc-low-threshold=45
          noTaints: true
          privateAddress: 10.3.0.1
          privateInterface: end0
        - ssh:
              address: 10.3.0.2
              user: root
              port: 22
          role: controller+worker
          installFlags:
              - --disable-components=konnectivity-server
              - --kubelet-extra-args=--image-gc-high-threshold=50 --image-gc-low-threshold=45
          noTaints: true
          privateAddress: 10.3.0.2
          privateInterface: end0
        - ssh:
              address: 10.3.0.3
              user: root
              port: 22
          role: controller+worker
          installFlags:
              - --disable-components=konnectivity-server
              - --kubelet-extra-args=--image-gc-high-threshold=50 --image-gc-low-threshold=45
          noTaints: true
          privateAddress: 10.3.0.3
          privateInterface: end0
