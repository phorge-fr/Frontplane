apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
    name: apps
    namespace: flux-system
spec:
    interval: 10m0s
    path: ./overlays/svc/apps
    sourceRef:
        kind: GitRepository
        name: flux-system
    prune: true
    wait: true
    timeout: 5m0s
    dependsOn:
        -   name: overlay-configs
    decryption:
        provider: sops
        secretRef:
            name: sops-age
